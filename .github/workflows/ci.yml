name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vectraid_test
          POSTGRES_USER: vectraid
          POSTGRES_PASSWORD: vectraid_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vectraid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,malware]"

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U vectraid && break
            sleep 1
          done

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://vectraid:vectraid_dev_password@localhost:5432/vectraid_test
          TEST_DATABASE_URL: postgresql+asyncpg://vectraid:vectraid_dev_password@localhost:5432/vectraid_test
        run: python -m pytest -q

      - name: Lint
        run: |
          ruff check app tests
          mypy app
